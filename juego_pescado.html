<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego del Pez vs Arpones</title>
    <link rel="stylesheet" href="css/peces.css">
</head>

<body>

    <div id="game-container">
        <div id="ui-layer">
            <span id="score-display">Puntos: 0</span>
            <span id="level-display">Nivel: 1</span>
            <span id="lives-display">Vidas: 3</span>
        </div>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div id="game-over-screen">
            <h1 style="color: #ff4444;">GAME OVER</h1>
            <p>¡Te has quedado sin vidas!</p>
            <p>Puntuación Final: <span id="final-score">0</span></p>
            <button onclick="reiniciarJuego()">Reintentar</button>
        </div>

        <div id="victory-screen">
            <h1 style="color: #44ff44;">¡GANASTE!</h1>
            <p>¡Has alcanzado los 30 puntos!</p>
            <button onclick="reiniciarJuego()">Jugar de Nuevo</button>
        </div>
    </div>

    <script src="js/Peces.js"></script>

</body>

</html>
